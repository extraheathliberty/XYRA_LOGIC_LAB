name: Logic Lab Business Classification Experimental Tests
on:
  push:
    paths:
      - 'src/xyra_logic/business_classification.py'
      - 'tests/test_business_classification.py'
      - '.github/workflows/business-classification-tests.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded classification unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_business_classification.py' -v
