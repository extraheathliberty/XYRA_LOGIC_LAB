name: XYRA Logic Lab bounded AGCOM reply
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: logic-agcom-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false
jobs:
  respond:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.type == 'Bot' &&
      github.event.comment.user.login == 'xyra-agcom-cc-bridge[bot]' &&
      startsWith(github.event.comment.body, 'XYRA-AGCOM-LOGIC/v1 PING ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: bridge
        with:
          app-id: '5563771'
          private-key: ${{ secrets.XYRA_BRIDGE_PRIVATE_KEY }}
          owner: extraheathliberty
          repositories: |
            XYRA_LOGIC_LAB
            XYRA_AGENT_COMMS_CENTRE_LAB
          permission-issues: write
      - uses: actions/github-script@v7
        env:
          INBOUND: ${{ github.event.comment.body }}
        with:
          github-token: ${{ steps.bridge.outputs.token }}
          script: |
            const m = /^XYRA-AGCOM-LOGIC\/v1 PING ([0-9a-f-]{36})(?:\n|$)/.exec(process.env.INBOUND || '');
            if (!m) return core.setFailed('Malformed PING');
            const id = m[1];
            const origin = await github.paginate(github.rest.issues.listComments, {
              owner: 'extraheathliberty', repo: 'XYRA_AGENT_COMMS_CENTRE_LAB',
              issue_number: 32, per_page: 100
            });
            const matching = origin.some(c => c.user?.login === 'xyra-agcom-cc-bridge[bot]' &&
              c.body?.startsWith('XYRA-AGCOM-LOGIC/v1 PING ' + id + '\n'));
            if (!matching) return core.setFailed('AGCOM origin PING missing');
            const body = 'XYRA-AGCOM-LOGIC/v1 PONG ' + id +
              '\nOrigin: Logic Lab #1; destination: AGCOM #32; transport acknowledgement only; no Logic Lab admission or AI decision.';
            for (const [repo, issue_number] of [['XYRA_LOGIC_LAB',1], ['XYRA_AGENT_COMMS_CENTRE_LAB',32]]) {
              await github.rest.issues.createComment({owner:'extraheathliberty',repo,issue_number,body});
            }
            core.info('Logic Lab PONG sent: ' + id);
